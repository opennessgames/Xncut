name: PUBGXNCUT-CI

on:
  push:
    branches: [milkshake]

# 这里我让AI写的.
jobs:
  include-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbid relative parent-dir includes
        run: |
          set -euo pipefail
          # 匹配 #include "..." 中含 ../ 的写法
          HITS=$(grep -rnE '^[[:space:]]*#[[:space:]]*include[[:space:]]*"[^"]*\.\./' \
                 --include='*.h' --include='*.hpp' --include='*.cpp' --include='*.cc' . || true)
          if [ -n "$HITS" ]; then
            echo "::error::发现跨目录相对 include，请改用 target_include_directories + 短路径"
            echo "$HITS"
            exit 1
          fi
          echo "OK: 未发现 ../ 形式的 include"